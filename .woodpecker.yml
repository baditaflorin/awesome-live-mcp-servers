when:
  - event: [push, pull_request, cron, manual]

steps:
  lint:
    image: python:3.13-alpine
    commands:
      - python3 -m py_compile scripts/*.py
      - python3 -c "import json; json.load(open('data/mcp-servers.json'))"

  test:
    image: python:3.13-alpine
    commands:
      - python3 -m unittest discover -s scripts -p 'test_*.py'

  verify-data:
    image: python:3.13-alpine
    commands:
      - python3 -c "
import json
data = json.load(open('data/mcp-servers.json'))
servers = data.get('servers', [])
assert isinstance(servers, list) and len(servers) > 0, 'data/mcp-servers.json servers must be non-empty list'
print(f'Verified {len(servers)} MCP servers in directory data feed.')
"
