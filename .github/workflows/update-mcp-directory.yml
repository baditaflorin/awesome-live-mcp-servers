name: Weekly MCP Directory Sync

on:
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force immediate sync and liveness probe'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DomainScope MCP Directory Sync
        run: |
          python3 scripts/sync_mcp_servers.py

      - name: Commit and push updates
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/mcp-servers.json data/mcp-servers.csv
          if git diff --staged --quiet; then
            echo "No changes detected in MCP server directory."
          else
            git commit -m "chore(sync): auto-update MCP servers directory & liveness [skip ci]"
            git push origin main
          fi
